[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelgate"
version = "1.0.0"
description = "Reproducible geometric model evaluation and fail-closed release gates"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Bowen Zhu"}]
dependencies = ["numpy==2.2.6"]

[project.scripts]
modelgate = "modelgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
